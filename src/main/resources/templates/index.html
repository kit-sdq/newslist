<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('News List')}"><title>News List</title></head>
<body>
<nav th:replace="~{fragments/layout :: navbar('news')}"></nav>
<main class="container py-4">
    <h1 class="h3 mb-3">Your News</h1>
    <div class="list-group" th:if="${!#lists.isEmpty(news)}">
        <div class="list-group-item" th:each="newsItem : ${news}">
            <h2 class="h6 fw-bold mb-1" th:text="${newsItem.getTitle()}"></h2>
            <p class="mb-0 opacity-75" style="white-space: pre-line" th:text="${newsItem.getContent()}"></p>
        </div>
    </div>
    <div class="alert alert-secondary" th:if="${#lists.isEmpty(news)}">No news for you right now.</div>
    <p class="text-body-secondary small mt-4">Identified as <span th:text="${emailAddress}"></span>, looking for news via
        '<span th:text="${saml2key}"></span>'.</p>
</main>
</body>
</html>
