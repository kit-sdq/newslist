<!doctype html>
<html xmlns:th="https://www.thymeleaf.org" lang="en">
<head th:fragment="head(title)">
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title}">SDQ-NewsList</title>
    <script>
        document.documentElement.setAttribute('data-bs-theme',
            window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/css/bootstrap.min.css}"/>
</head>
<body>
<nav th:fragment="navbar(active)" class="navbar navbar-expand-sm bg-body-tertiary border-bottom">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/}">SDQ-NewsList</a>
        <ul class="navbar-nav flex-row me-auto gap-3">
            <li class="nav-item">
                <a class="nav-link" th:classappend="${active == 'news'} ? 'active'"
                   th:attr="aria-current=${active == 'news'} ? 'page'" th:href="@{/}">News</a>
            </li>
            <li class="nav-item" th:if="${isAdmin}">
                <a class="nav-link" th:classappend="${active == 'admin'} ? 'active'"
                   th:attr="aria-current=${active == 'admin'} ? 'page'" th:href="@{/admin}">Admin</a>
            </li>
        </ul>
        <span class="navbar-text text-truncate small" th:text="${emailAddress}"></span>
    </div>
</nav>
</body>
</html>
